name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WifiFallbackUI.exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Run engine tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\WifiFallback.Tests.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiFallbackUI
          path: WifiFallbackUI.exe
          if-no-files-found: error
